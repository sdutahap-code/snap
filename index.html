<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Open in Browser</title>

<style>

body{
    margin:0;
    height:100vh;
    background:#000;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:350px;
    background:#111;
    color:white;
    border-radius:25px;
    padding:30px 20px;
    text-align:center;
    position:relative;
}

.snap{
    width:85px;
    height:85px;
    background:#fffc00;
    border-radius:20px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
}

h1{
    margin:20px 0;
}

.menu{
    position:absolute;
    top:15px;
    right:20px;
    font-size:35px;
    color:white;
}

.arrow{
    position:absolute;
    top:45px;
    right:55px;
    color:#fffc00;
    font-size:45px;
    transform:rotate(20deg);
}

.text{
    background:#222;
    padding:15px;
    border-radius:15px;
    margin-top:20px;
    font-size:17px;
}

button{
    margin-top:25px;
    width:100%;
    padding:16px;
    border:none;
    border-radius:30px;
    background:#fffc00;
    font-size:18px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

<div class="menu">
⋮
</div>

<div class="arrow">
↗
</div>

<div class="snap">
👻
</div>

<h1>Open Link</h1>

<div class="text">
Tap the three dots in the top right corner
</div>

<div class="text">
Select "Open in Browser"
</div>

<button onclick="openLink()">
OPEN LINK
</button>

</div>


<script>

function openLink(){
    window.location.href="https://linktr.ee/Emilyyy_hot";
}

</script>

</body>
</html>
