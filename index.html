<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open in Browser</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:Arial,Helvetica,sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.box{
text-align:center;
animation:fade 1s ease;
}

.arrow{
font-size:90px;
color:#ff1a1a;
line-height:1;
animation:bounce 1s infinite;
margin-bottom:20px;
}

.text{
font-size:34px;
font-weight:900;
color:#fff;
text-transform:uppercase;
letter-spacing:2px;
text-shadow:0 0 10px rgba(255,255,255,.4);
}

.small{
margin-top:12px;
font-size:18px;
color:#d0d0d0;
letter-spacing:1px;
}

@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-18px);}
}

@keyframes fade{
from{opacity:0;transform:scale(.9);}
to{opacity:1;transform:scale(1);}
}
</style>

<script>
document.addEventListener("click",function(){
window.location.href="https://linktr.ee/Emilyyy_hot";
});
</script>

</head>
<body>

<div class="box">
<div class="arrow">⬆️</div>
<div class="text">TAP THE ••• ABOVE</div>
<div class="small">Open in your browser</div>
</div>

</body>
</html>
