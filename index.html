<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlock</title>
<style>
  body { 
    background: #000; 
    margin:0; 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial; 
    color:#fff; 
    padding-bottom: 60px;
  }
  
  /* Banner i verdhë sipër */
  .top-banner { 
    background:#FFFC00; 
    color:#000; 
    padding:16px 20px; 
    font-weight:800; 
    display:flex; 
    justify-content:space-between; 
    align-items:center; 
    font-size:17px;
  }
  
  /* Detected pill */
  .detected { 
    background:#1a1a1a; 
    border:1px solid #333; 
    border-radius:30px; 
    padding:10px 20px; 
    display:flex;
    align-items:center;
    gap:10px;
    margin:24px auto; 
    font-size:15px; 
    width: fit-content;
    color:#999;
  }
  .dot { width:10px; height:10px; background:#FFFC00; border-radius:50%; box-shadow:0 0 10px #FFFC00; }
  
  /* Kardia kryesore */
  .card { 
    background:#fff; 
    color:#000; 
    margin:0 20px; 
    padding:28px 24px; 
    border-radius:28px; 
    max-width:520px; 
    margin-left:auto; 
    margin-right:auto;
  }
  
  .card-header { display:flex; align-items:flex-start; gap:14px; margin-bottom:20px; }
  .snap-logo { width:60px; height:60px; background:#FFFC00; border-radius:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .snap-logo svg { width:38px; height:38px; }
  
  .card h2 { margin:0 0 8px 0; font-size:23px; font-weight:800; }
  .card p { margin:0; font-size:15px; line-height:1.5; color:#333; }
  
  /* Hapat */
  .step { 
    display:flex; 
    align-items:flex-start; 
    margin:22px 0; 
    font-size:15px; 
    line-height:1.5; 
    gap:14px;
  }
  .circle { 
    min-width:38px; 
    height:38px; 
    background:#FFFC00; 
    border-radius:50%; 
    display:flex; 
    align-items:center; 
    justify-content:center; 
    font-weight:900; 
    font-size:17px;
    box-shadow: 0 0 15px rgba(255,252,0,0.6);
    animation: glow 1.8s ease-in-out infinite; /* SHIFRAT LEVIZIN */
  }
  @keyframes glow {
    0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(255,252,0,0.6); }
    50% { transform: scale(1.1); box-shadow: 0 0 25px rgba(255,252,0,0.9); }
  }
  
  /* Menu poshtë */
  .menu { 
    background:#FFFC00; 
    border-radius:20px; 
    margin:30px 20px; 
    max-width:520px; 
    margin-left:auto; 
    margin-right:auto;
    overflow:hidden;
    border:3px solid #FFFC00;
  }
  .
