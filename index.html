<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open in Browser</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b);
overflow:hidden;
}

.card{
width:360px;
background:rgba(255,255,255,.1);
backdrop-filter:blur(18px);
padding:30px;
border-radius:25px;
text-align:center;
color:white;
box-shadow:0 15px 40px rgba(0,0,0,.4);
animation:fade .6s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}

.icon{
font-size:70px;
margin-bottom:15px;
}

h1{
font-size:28px;
margin-bottom:10px;
}

p{
opacity:.9;
margin-bottom:20px;
}

.step{
background:rgba(255,255,255,.12);
padding:14px;
margin:10px 0;
border-radius:12px;
font-size:17px;
}

.button{
display:block;
margin-top:25px;
padding:16px;
border-radius:14px;
background:#FFD400;
color:#000;
font-weight:bold;
font-size:18px;
text-decoration:none;
transition:.25s;
}

.button:hover{
transform:scale(1.03);
}

.note{
margin-top:20px;
font-size:13px;
opacity:.75;
}
</style>

</head>

<body>

<div class="card">

<div class="icon">🌐</div>

<h1>Open in Browser</h1>

<p>For the best experience follow these steps</p>

<div class="step">① Tap ⋮ (top right)</div>

<div class="step">② Select <b>Open in Browser</b></div>

<div class="step">③ Continue securely</div>

<a class="button" href="https://YOUR-WEBSITE.COM">
Continue
</a>

<div class="note">
If you're already using Chrome or another browser, you can continue normally.
</div>

</div>

</body>
</html>
