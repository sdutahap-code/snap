<!DOCTYPE html>
<html lang="sq">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snap Link</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: linear-gradient(#050505, #1a1a1a);
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.phone {
  width: 350px;
  background: #000;
  border-radius: 35px;
  padding: 25px;
  color: white;
  text-align: center;
  border: 3px solid #333;
}

.snap {
  width: 85px;
  height: 85px;
  background: #fffc00;
  border-radius: 25px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 55px;
}

.title {
  font-size: 25px;
  margin: 20px 0;
}

.instruction {
  background: #161616;
  padding: 15px;
  border-radius: 15px;
  font-size: 17px;
}

.arrow {
  font-size: 55px;
  color: #fffc00;
  margin: 15px 0;
}

.button {
  margin-top: 25px;
  width: 100%;
  padding: 16px;
  border-radius: 30px;
  border: none;
  background: #fffc00;
  font-size: 18px;
  font-weight: bold;
}

.button:hover {
  opacity: 0.8;
}
</style>

</head>

<body>

<div class="phone">

  <div class="snap">👻</div>

  <div class="title">
    Hap në Browser
  </div>

  <div class="instruction">
    Shtyp te 3 pikat
    <br>
    lart djathtas
  </div>

  <div class="arrow">
    ↗ ⋮
  </div>

  <div class="instruction">
    Zgjidh "Open in Browser"
  </div>

  <button class="button" onclick="go()">
    HAP LINKUN
  </button>

</div>


<script>
function go(){
  window.location.href="https://linktr.ee/Emilyyy_hot";
}
</script>

</body> 
</html>
