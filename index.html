<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open in Browser</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
color:#fff;
}

.header{
height:70px;
background:#fff;
color:#000;
display:flex;
align-items:center;
padding:15px;
position:relative;
}

.loading{
font-size:28px;
font-weight:bold;
margin-left:50px;
}

.site{
margin-left:50px;
margin-top:4px;
font-size:18px;
color:#666;
}

.close{
position:absolute;
left:20px;
font-size:38px;
}

.menu{
position:absolute;
right:20px;
font-size:34px;
}

.bar{
background:#FFD400;
color:#000;
padding:18px;
display:flex;
justify-content:space-between;
font-size:24px;
font-weight:bold;
position:relative;
}

.arrow{
position:absolute;
right:10px;
top:-5px;
font-size:70px;
color:#FFD400;
animation:bounce .8s infinite alternate;
}

@keyframes bounce{
0%{
transform:translate(-12px,12px) rotate(-35deg);
}
100%{
transform:translate(0,0) rotate(-35deg) scale(1.15);
}
}

.card{
width:90%;
margin:35px auto;
background:#fff;
color:#111;
border-radius:22px;
padding:25px;
}

.card h2{
font-size:36px;
margin-bottom:15px;
}

.card p{
font-size:24px;
margin:18px 0;
}

.btn{
display:block;
width:88%;
margin:40px auto;
padding:22px;
background:#FFD400;
color:#000;
font-size:30px;
font-weight:bold;
text-align:center;
text-decoration:none;
border-radius:18px;
box-shadow:0 0 18px #FFD400;
}
</style>
</head>

<body>

<div class="header">
<div class="close">✕</div>

<div>
<div class="loading">Loading...</div>
<div class="site">beacons.ai</div>
</div>

<div class="menu">•••</div>
</div>

<div class="bar">
<span>Restricted</span>
<span>Tap ••• here</span>
<div class="arrow">↗</div>
</div>

<div class="card">

<h2>Open in your browser</h2>

<p>① Tap the (•••) menu in the top right.</p>

<p>② Select <b>Open in Browser</b>.</p>

<p>③ Continue to access the full page.</p>

</div>

<a class="btn" href="https://beacons.ai/emilyyy_hot">
Open in Browser →
</a>

</body>
</html>
