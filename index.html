<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open in Browser</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#111;
color:#fff;
}

.top{
background:#FFD400;
color:#000;
padding:18px;
font-size:22px;
font-weight:bold;
text-align:center;
}

.container{
max-width:430px;
margin:30px auto;
padding:15px;
}

.browser{
background:#222;
border:1px solid #444;
border-radius:50px;
padding:14px;
text-align:center;
font-size:18px;
color:#ddd;
margin-bottom:20px;
}

.card{
background:#fff;
color:#111;
border-radius:24px;
padding:28px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

h1{
font-size:34px;
margin-bottom:15px;
}

p{
font-size:18px;
line-height:1.6;
color:#444;
margin-bottom:20px;
}

.step{
display:flex;
align-items:center;
margin:18px 0;
font-size:18px;
}

.number{
width:36px;
height:36px;
background:#FFD400;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
margin-right:14px;
color:#000;
}

.button{
display:block;
margin-top:30px;
background:#FFD400;
color:#000;
text-decoration:none;
text-align:center;
padding:18px;
border-radius:15px;
font-size:22px;
font-weight:bold;
}

.footer{
margin-top:18px;
text-align:center;
font-size:14px;
color:#999;
}
</style>

</head>
<body>

<div class="top">
⚠ Continue to Website
</div>

<div class="container">

<div class="browser">
📱 Browser detected
</div>

<div class="card">

<h1>Open Link</h1>

<p>
For the best experience, tap the button below to continue.
</p>

<div class="step">
<div class="number">1</div>
Tap the button below
</div>

<div class="step">
<div class="number">2</div>
The website will open
</div>

<div class="step">
<div class="number">3</div>
Enjoy your visit
</div>

<a class="button"
href="https://beacons.ai/emilyyy_hot"
target="_blank"
rel="noopener">
🌐 Continue
</a>

</div>

<div class="footer">
Powered by GitHub Pages
</div>

</div>

</body>
</html>
