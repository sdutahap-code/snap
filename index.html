<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Browser</title>

<style>
body {
    margin: 0;
    background: #000;
    font-family: Arial;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    width: 320px;
    background: white;
    border-radius: 25px;
    padding: 25px;
    text-align: center;
    position: relative;
}

.logo {
    width: 80px;
    height: 80px;
    background: #fffc00;
    border-radius: 20px;
    margin: auto;
    font-size: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.dots {
    position: absolute;
    right: 20px;
    top: 15px;
    font-size: 35px;
}

.arrow {
    position: absolute;
    right: 55px;
    top: 35px;
    font-size: 45px;
    color: #ffcc00;
}

h2 {
    margin-top: 25px;
}

p {
    font-size: 18px;
}

.box {
    background: #eee;
    padding: 15px;
    border-radius: 15px;
    margin-top: 20px;
}

button {
    margin-top: 25px;
    background: #fffc00;
    border: 0;
    border-radius: 30px;
    padding: 15px;
    width: 100%;
    font-size: 18px;
    font-weight: bold;
}
</style>

</head>

<body>

<div class="card">

<div class="dots">⋮</div>
<div class="arrow">➜</div>

<div class="logo">
👻
</div>

<h2>Open Link</h2>

<p>
Tap the three dots in the top right
</p>

<div class="box">
Select "Open in Browser"
</div>

<button onclick="openLink()">
OPEN LINK
</button>

</div>


<script>
function openLink(){
window.location.href="https://linktr.ee/Emilyyy_hot";
}
</script>

</body>
</html>
