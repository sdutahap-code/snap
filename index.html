<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Open in Browser</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{
width:90%;
max-width:420px;
background:white;
color:#111;
border-radius:25px;
padding:25px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.5);
position:relative;
}

.arrow{
position:absolute;
top:-90px;
right:10px;
font-size:70px;
color:red;
animation:bounce 1s infinite;
}

@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

.banner{
background:#FFD400;
padding:15px;
font-weight:bold;
font-size:22px;
border-radius:15px;
margin-bottom:20px;
}

h1{
margin:15px 0;
}

.step{
text-align:left;
margin:15px 0;
font-size:18px;
}

.button{
display:block;
margin-top:25px;
padding:18px;
background:#FFD400;
color:black;
font-size:22px;
font-weight:bold;
text-decoration:none;
border-radius:15px;
}

.button:hover{
background:#ffea63;
}
</style>

</head>
<body>

<div class="card">

<div class="arrow">↗</div>

<div class="banner">
⚠ Restricted
</div>

<h1>Unlock Full Access</h1>

<div class="step">① Tap the <b>⋮</b> menu at the top right.</div>
<div class="step">② Select <b>Open in Browser</b>.</div>
<div class="step">③ Continue to the page.</div>

<a class="button"
href="https://linktr.ee/Emilyyy_hot">
🌐 Open in Browser
</a>

</div>

</body>
</html>
