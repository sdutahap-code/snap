<!DOCTYPE html>
<html lang="sq">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Open Link</title>

<style>

body{
    margin:0;
    height:100vh;
    background:#0b0b0b;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:340px;
    background:#171717;
    border-radius:30px;
    padding:30px;
    text-align:center;
    color:white;
    box-shadow:0 0 30px #000;
}

.logo{
    width:90px;
    height:90px;
    margin:auto;
    background:#fffc00;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:55px;
}

h1{
    font-size:26px;
    margin:20px 0;
}

.step{
    background:#222;
    border-radius:20px;
    padding:15px;
    font-size:17px;
    margin-top:15px;
}

.arrow{
    font-size:60px;
    color:#fffc00;
    animation:move 1s infinite;
}

@keyframes move{
    50%{
        transform:translateY(-10px);
    }
}

.btn{
    margin-top:25px;
    background:#fffc00;
    color:#000;
    padding:17px;
    width:100%;
    border:0;
    border-radius:35px;
    font-size:20px;
    font-weight:bold;
}

.top{
    display:flex;
    justify-content:flex-end;
    font-size:35px;
}

</style>

</head>

<body>

<div class="container">

<div class="top">
⋮
</div>

<div class="logo">
👻
</div>

<h1>Hap Linkun</h1>

<div class="step">
Kliko 3 pikat lart djathtas
</div>

<div class="arrow">
⬆
</div>

<div class="step">
Pastaj hap në Browser
</div>

<button class="btn" onclick="openPage()">
HAP TANI
</button>

</div>


<script>

function openPage(){
window.location.href="https://linktr.ee/Emilyyy_hot";
}

</script>

</body>
</html>
