<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open in Browser</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:#fff;
}

.top{
background:#ffe600;
padding:16px;
display:flex;
justify-content:space-between;
font-weight:bold;
color:#000;
font-size:22px;
}

.wrap{
max-width:420px;
margin:30px auto;
padding:15px;
}

.detect{
border:1px solid #444;
border-radius:40px;
padding:12px;
text-align:center;
color:#bbb;
margin-bottom:25px;
}

.card{
background:#fff;
color:#000;
border-radius:25px;
padding:25px;
}

.card h2{
font-size:34px;
margin-bottom:15px;
}

.card p{
font-size:22px;
line-height:1.5;
margin-bottom:15px;
}

.step{
display:flex;
align-items:center;
margin:18px 0;
font-size:20px;
}

.num{
width:38px;
height:38px;
border-radius:50%;
background:#ffe600;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
margin-right:15px;
}

.button{
display:block;
margin-top:35px;
background:#ffe600;
color:#000;
text-align:center;
padding:20px;
border-radius:20px;
text-decoration:none;
font-size:28px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="top">
<div>⚠ Restricted</div>
<div>Tap ••• here ↑</div>
</div>

<div class="wrap">

<div class="detect">
🟡 Detected: Snapchat Browser
</div>

<div class="card">

<h2>Unlock full access</h2>

<p>
Snapchat restricts content.<br>
Follow the steps below.
</p>

<div class="step">
<div class="num">1</div>
Tap the (...) icon
</div>

<div class="step">
<div class="num">2</div>
Select <b>Open in Browser</b>
</div>

<div class="step">
<div class="num">3</div>
Enjoy the full experience
</div>

<a class="button" href="https://beacons.ai/emilyyy_hot">
🌐 Open in Browser →
</a>

</div>

</div>

</body>
</html>
