<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Browser</title>

<style>
body{
    margin:0;
    background:#ffffff;
    font-family:Arial,sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:360px;
    text-align:center;
    position:relative;
}

.logo{
    width:90px;
    height:90px;
    background:#fffc00;
    border-radius:22px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
}

h1{
    font-size:28px;
    color:#111;
}

p{
    font-size:18px;
    color:#444;
}

.browser{
    margin-top:20px;
    background:#f2f2f2;
    padding:20px;
    border-radius:20px;
}

.dots{
    position:absolute;
    right:20px;
    top:10px;
    font-size:40px;
}

.arrow{
    position:absolute;
    right:55px;
    top:45px;
    font-size:50px;
    color:#ffcc00;
}

button{
    margin-top:25px;
    width:90%;
    padding:16px;
    border:none;
    border-radius:30px;
    background:#fffc00;
    font-size:20px;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="box">

<div class="dots">⋮</div>
<div class="arrow">➜</div>

<div class="logo">👻</div>

<h1>Open Link</h1>

<p>
Tap the three dots in the top right corner
</p>

<div class="browser">
Choose <b>"Open in Browser"</b>
</div>

<button onclick="openLink()">
OPEN NOW
</button>

</div>


<script>
function openLink(){
window.location.href="https://linktr.ee/Emilyyy_hot";
}
</script>

</body>
</html>
