<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open in Browser</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
color:#fff;
}

.top{
height:72px;
background:#fff;
display:flex;
align-items:center;
padding:15px;
position:relative;
}

.close{
font-size:36px;
color:#000;
margin-right:15px;
}

.loading{
color:#000;
font-size:28px;
font-weight:bold;
}

.site{
color:#777;
font-size:18px;
}

.menu{
position:absolute;
right:22px;
top:18px;
font-size:34px;
color:#000;
font-weight:bold;
}

.bar{
height:62px;
background:#ffd400;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
font-size:24px;
font-weight:bold;
color:#000;
position:relative;
}

.tap{
margin-right:80px;
}

.arrow{
position:absolute;
right:10px;
top:-5px;
font-size:95px;
color:#000;
transform:rotate(-40deg);
animation:move .8s infinite alternate;
}

@keyframes move{
0%{
transform:translate(-15px,15px) rotate(-40deg);
}
100%{
transform:translate(0,0) rotate(-40deg) scale(1.12);
}
}

.card{
width:90%;
margin:40px auto;
background:#fff;
color:#111;
border-radius:24px;
padding:25px;
box-shadow:0 0 25px rgba(255,255,255,.15);
}

.card h2{
font-size:34px;
margin-bottom:20px;
}

.step{
font-size:22px;
margin:18px 0;
line-height:1.5;
}

.button{
display:block;
width:90%;
margin:35px auto;
background:#ffd400;
padding:22px;
border-radius:18px;
text-align:center;
font-size:30px;
font-weight:bold;
color:#000;
text-decoration:none;
box-shadow:0 0 20px #ffd400;
transition:.3s;
}

.button:hover{
transform:scale(1.03);
}
</style>

</head>

<body>

<div class="top">

<div class="close">✕</div>

<div>
<div class="loading">Loading...</div>
<div class="site">beacons.ai</div>
</div>

<div class="menu">•••</div>

</div>

<div class="bar">

<span>Restricted</span>

<span class="tap">Tap ••• here</span>

<div class="arrow">➜</div>

</div>

<div class="card">

<h2>Open in your browser</h2>

<div class="step">
① Tap the <b>(•••)</b> menu in the top right.
</div>

<div class="step">
② Choose <b>Open in Browser</b>.
</div>

<div class="step">
③ Continue to the full experience.
</div>

</div>

<a class="button"
href="https://beacons.ai/emilyyy_hot">
Open in Browser →
</a>

</body>
</html>
